# 🎁 交換！截止後由管理員手動執行；EVENT_STATE 為 TIME / TIME_SYNC 時由 schedule.yml 在截止後自動執行。
# 重新評測 → 用公開 seed 配對 → commit exchange.json → 開公告 issue → 更新展示頁
# 已經有 exchange.json 時不重新配對，直接用既有的結果重新部署網站（刪掉 exchange.json 才會重新交換）。
# → 停用 ci 以外的 workflow（活動結束：不再評測 PR、不再部署或交換；要恢復可到 Actions 頁面重新啟用）
# TIME / TIME_SYNC 的 seed 固定為截止前 main 上最後一個 commit 的 sha，不能另外指定。
name: Exchange

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 公開的配對 seed（建議事先公告來源；留空則用目前的 commit sha；TIME 模式不能指定）
        required: false
  workflow_call:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: exchange

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # TIME 模式要從完整歷史找出截止前最後一個 commit
          fetch-depth: 0

      - name: Check existing exchange
        id: existing
        run: |
          if [ -f exchange.json ]; then
            echo "已有 exchange.json，沿用既有的交換結果，只重新部署網站"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: steps.existing.outputs.found == 'false'
        run: node packages/tools/src/judge-all.ts --out out/results

      - name: Pair
        if: steps.existing.outputs.found == 'false'
        env:
          SEED_INPUT: ${{ inputs.seed }}
          SITE_URL: ${{ vars.SITE_URL }}
          # 還在收件中（PROGRESS / PROGRESS_SYNC）時拒絕交換
          EVENT_STATE: ${{ vars.EVENT_STATE }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SITE="${SITE_URL:-https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}}"
          node packages/tools/src/exchange.ts ${SEED_INPUT:+--seed "$SEED_INPUT"} \
            --fallback-seed "$GITHUB_SHA" --site-url "$SITE" --out-dir out
          echo "SEED=$(node -p 'require("./exchange.json").seed')" >> "$GITHUB_ENV"

      - name: Commit exchange.json
        if: steps.existing.outputs.found == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange.json
          git commit -m "chore: exchange trees (seed $SEED)"
          git push

      - name: Announce
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "🎁 聖誕樹交換開始" --body-file out/issue.md)
          # 每份禮物一則留言 @ 收到的人；間隔幾秒，避免觸發 GitHub 發文的速率限制
          for f in out/gift-*.md; do
            [ -e "$f" ] || continue
            gh issue comment "$url" --body-file "$f"
            sleep 3
          done

  pages:
    needs: exchange
    uses: ./.github/workflows/pages.yml

  # 網站部署成功後才停用；部署失敗時維持啟用，方便重跑
  retire:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disable workflows except ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in review.yml pages.yml exchange.yml schedule.yml; do
            gh workflow disable "$wf"
            echo "已停用 $wf"
          done
