# 🎁 交換！截止後由管理員手動執行；EVENT_STATE 為 TIME / TIME_SYNC 時由 schedule.yml 在截止後自動執行。
# 重新評測 → 用公開 seed 配對 → commit exchange.json → 開公告 issue → 更新展示頁
# TIME / TIME_SYNC 的 seed 固定為截止前 main 上最後一個 commit 的 sha，不能另外指定。
name: Exchange

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 公開的配對 seed（建議事先公告來源；留空則用目前的 commit sha；TIME 模式不能指定）
        required: false
  workflow_call:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: exchange

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # TIME 模式要從完整歷史找出截止前最後一個 commit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/tools/src/judge-all.ts --out out/results

      - name: Pair
        env:
          SEED_INPUT: ${{ inputs.seed }}
          SITE_URL: ${{ vars.SITE_URL }}
          # 還在收件中（PROGRESS / PROGRESS_SYNC）時拒絕交換
          EVENT_STATE: ${{ vars.EVENT_STATE }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SITE="${SITE_URL:-https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}}"
          node packages/tools/src/exchange.ts ${SEED_INPUT:+--seed "$SEED_INPUT"} \
            --fallback-seed "$GITHUB_SHA" --site-url "$SITE" --out-dir out
          echo "SEED=$(node -p 'require("./exchange.json").seed')" >> "$GITHUB_ENV"

      - name: Commit exchange.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange.json
          git commit -m "chore: exchange trees (seed $SEED)"
          git push

      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "🎁 聖誕樹交換結果" --body-file out/issue.md)
          for f in out/mentions-*.md; do gh issue comment "$url" --body-file "$f"; done

  pages:
    needs: exchange
    uses: ./.github/workflows/pages.yml
