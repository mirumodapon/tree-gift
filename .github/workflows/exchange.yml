# 🎁 交換！截止後由管理員手動執行；EVENT_STATE 為 TIME / TIME_SYNC 時由 schedule.yml 在截止後自動執行。
# 重新評測 → 用公開 seed 配對 → commit exchange.json → 開公告 issue → 更新展示頁
# TIME / TIME_SYNC 的 seed 固定為截止前 main 上最後一個 commit 的 sha，不能另外指定。
name: Exchange

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 公開的配對 seed（建議事先公告來源；留空則用目前的 commit sha；TIME 模式不能指定）
        required: false
  workflow_call:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: exchange

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # TIME 模式要從完整歷史找出截止前最後一個 commit；也要拿到記錄 seed 的 tag
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/tools/src/judge-all.ts --out out/results

      - name: Pair
        env:
          SEED_INPUT: ${{ inputs.seed }}
          SITE_URL: ${{ vars.SITE_URL }}
          # 還在收件中（PROGRESS / PROGRESS_SYNC）時拒絕交換
          EVENT_STATE: ${{ vars.EVENT_STATE }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SITE="${SITE_URL:-https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}}"
          node packages/tools/src/exchange.ts ${SEED_INPUT:+--seed "$SEED_INPUT"} \
            --fallback-seed "$GITHUB_SHA" --site-url "$SITE" --out-dir out
          echo "SEED=$(node -p 'require("./exchange.json").seed')" >> "$GITHUB_ENV"

      - name: Commit exchange.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange.json
          git commit -m "chore: exchange trees (seed $SEED)"
          git push

      # 記錄這次的 seed：commit sha → tag exchange；自訂 seed → tag exchange-<seed>（指向上面的 commit）
      # 之後再交換一律沿用 tag 上的 seed（見 packages/tools/src/seed.ts）
      - name: Tag seed
        run: |
          TAG_NAME=$(node -p 'require("./out/seed-tag.json").name')
          TAG_TARGET=$(node -p 'require("./out/seed-tag.json").target || "HEAD"')
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "tag $TAG_NAME 已存在"
          else
            git tag "$TAG_NAME" "$TAG_TARGET"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "🎁 聖誕樹交換開始" --body-file out/issue.md)
          # 每份禮物一則留言 @ 收到的人；間隔幾秒，避免觸發 GitHub 發文的速率限制
          for f in out/gift-*.md; do
            [ -e "$f" ] || continue
            gh issue comment "$url" --body-file "$f"
            sleep 3
          done

  pages:
    needs: exchange
    uses: ./.github/workflows/pages.yml
