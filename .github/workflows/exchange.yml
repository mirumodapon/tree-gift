# 🎁 交換！截止後由管理員手動執行。
# 重新評測 → 用公開 seed 配對 → commit exchange.json → 開公告 issue → 更新展示頁
name: Exchange

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 公開的配對 seed（建議事先公告來源；留空則用目前的 commit sha）
        required: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: exchange

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/tools/src/judge-all.ts --out out/results

      - name: Pair
        env:
          SEED_INPUT: ${{ inputs.seed }}
          SITE_URL: ${{ vars.SITE_URL }}
          # 還在收件中（PROGRESS / PROGRESS_SYNC）時拒絕交換
          EVENT_STATE: ${{ vars.EVENT_STATE }}
        run: |
          SEED="${SEED_INPUT:-$GITHUB_SHA}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SITE="${SITE_URL:-https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}}"
          node packages/tools/src/exchange.ts --seed "$SEED" --site-url "$SITE" --out-dir out
          echo "SEED=$SEED" >> "$GITHUB_ENV"

      - name: Commit exchange.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange.json
          git commit -m "chore: exchange trees (seed $SEED)"
          git push

      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "🎁 聖誕樹交換結果" --body-file out/issue.md)
          for f in out/mentions-*.md; do gh issue comment "$url" --body-file "$f"; done

  pages:
    needs: exchange
    uses: ./.github/workflows/pages.yml
