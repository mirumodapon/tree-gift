# 評測 PR 裡的投稿。
# 用 pull_request 觸發：token 唯讀、拿不到 secrets，可以安全地執行 PR 的內容。
# 結果以 artifact 交給 comment.yml 留言（那邊才有寫入權限）。
name: Judge

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Judge submissions/${{ github.event.pull_request.user.login }}
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node packages/judge/src/cli.ts "submissions/$AUTHOR" --user "$AUTHOR" --out out/result.json

      - name: Save PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mkdir -p out && echo "$PR_NUMBER" > out/pr_number

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-result
          path: out/
          retention-days: 7
