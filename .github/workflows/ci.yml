# judge 與工具本身的檢查（lint / format / typecheck / 測試）
name: CI

on:
  push:
    branches: [main]
    paths: [packages/**, rules.ts, package.json, pnpm-lock.yaml, .github/workflows/ci.yml]
  pull_request:
    paths: [packages/**, rules.ts, package.json, pnpm-lock.yaml, .github/workflows/ci.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
