# 建置 VitePress 網站並部署到 GitHub Pages。
# EVENT_STATE（repo variable）決定是否把聖誕樹放上網站；不公開時不評測、網站裡也不會有作品內容。
# 注意：修改 EVENT_STATE 不會觸發部署，改完請手動執行這個 workflow。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - submissions/**
      - exchange.json
      - rules.ts
      - packages/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # 由 exchange.yml 呼叫時要拿到剛 commit 的 exchange.json
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages

      - name: Read EVENT_STATE
        id: event
        env:
          EVENT_STATE: ${{ vars.EVENT_STATE }}
        run: |
          node --input-type=module -e "
            import { currentEvent } from '@gift/judge'
            const { state, policy } = currentEvent()
            console.log('state=' + state)
            console.log('publish=' + policy.publishTrees)
          " | tee -a "$GITHUB_OUTPUT"

      - name: Judge all submissions
        if: steps.event.outputs.publish == 'true'
        run: node packages/tools/src/judge-all.ts

      - name: Build site
        env:
          EVENT_STATE: ${{ vars.EVENT_STATE }}
          # 專案網站在 /<repo>/ 底下；使用者網站或自訂網域時 base_path 為空
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm -F @gift/site build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
